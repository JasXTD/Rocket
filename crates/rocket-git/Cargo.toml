[package]
name = "rocket-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rocket's Git helper backend"
publish = false

[lints]
workspace = true

# Deliberately no third-party dependencies, including development dependencies, with two
# exceptions on Linux, both from RustCrypto, where Windows uses what the system provides:
# - remembered credentials are sealed with XChaCha20-Poly1305 (audited), under a key kept
#   in the desktop keyring, as DPAPI seals them on Windows. Default features are off: the
#   key and nonces come from getrandom(2) directly;
# - files are checked with SHA-256 (the OSV-Scanner pin, bisect test programs, LFS objects
#   before pruning), as BCrypt checks them on Windows. Default features (alloc, OIDs) are off.
[target.'cfg(target_os = "linux")'.dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.1", default-features = false }
