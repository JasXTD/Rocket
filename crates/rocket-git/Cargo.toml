[package]
name = "rocket-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rocket's Git helper backend"
publish = false

[lints]
workspace = true

# Deliberately no third-party dependencies, including development dependencies, with two
# exceptions from RustCrypto, where Windows uses what the system provides:
# - remembered credentials are sealed with XChaCha20-Poly1305 (audited), under a key kept
#   in the desktop keyring or macOS Keychain, as DPAPI seals them on Windows. Default
#   features are off: keys/nonces come from getrandom(2) or SecRandomCopyBytes;
# - Linux/macOS files are checked with SHA-256 (pins, bisect test programs, LFS objects
#   before pruning), as BCrypt checks them on Windows. Default features (alloc, OIDs) are off.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.1", default-features = false }
