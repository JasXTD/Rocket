[package]
name = "rocket-lua-wasm-guest-prototype"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "=1.0.151"
mlua = { version = "=0.12.2", default-features = false, features = ["lua55"] }
mlua-sys = { version = "=0.13.0", default-features = false, features = ["lua55", "external"] }

[build-dependencies]
lua-src = "=551.1.0"
cc = "=1.11.1"
