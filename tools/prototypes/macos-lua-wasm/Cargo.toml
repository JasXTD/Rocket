[workspace]
members = ["guest", "probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.pulley-interpreter]
opt-level = 2

[profile.release]
debug = 0
strip = "debuginfo"
opt-level = 2
codegen-units = 8
incremental = false

# Standalone compatibility experiment. Not a member of Rocket's application
# workspace and not a production macOS sandbox or bundled release component.
