<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket · Nested workspaces</title>
<style>
:root{color-scheme:dark;--bg:#08141f;--panel:#0d1d2b;--card:#102434;--line:#254051;--fg:#e1ebf3;--muted:#8ea6b9;--accent:#29bcdf;--selected:#173c57;--danger:#ff8e99}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px "Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{background:var(--selected)}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--selected);border-color:#33779c}header{border-bottom:1px solid var(--line);padding:9px 18px;background:#09131c;display:flex;gap:24px;font-size:13px}.heading{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 12px}.heading h1{font-size:23px;margin:0 0 7px}.muted,small{color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 19px}.app{height:calc(100vh - 164px);min-height:450px;display:grid;grid-template-columns:245px 1fr;border-top:1px solid var(--line)}nav{padding:19px 12px;overflow:auto;border-right:1px solid var(--line)}.caption{text-transform:uppercase;letter-spacing:1.3px;font-size:10px;color:var(--muted);margin:4px 10px 12px}.tree-row{display:flex;align-items:center;gap:2px;margin:3px 0}.tree-row button{border:0;background:none;min-width:0}.tree-row .expand{width:25px;padding:7px 2px;flex-shrink:0}.tree-row .name{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-row.active{background:var(--selected);border-radius:6px}.tree-row .symbol{color:var(--accent);margin-right:7px}nav .flat{width:100%;text-align:left;margin-bottom:4px;border:0;background:none}main{padding:23px;overflow:auto;min-width:0}.crumb{color:var(--muted);font-size:12px;margin-bottom:8px}h2{font-size:24px;margin:0 0 8px;font-weight:600}.content{display:grid;grid-template-columns:minmax(240px,1fr) 255px;gap:22px;margin-top:22px}.cards{display:grid;gap:10px;align-content:start}.repo{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--panel);min-width:0}.repo .top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.tag{font-size:11px;color:var(--accent);white-space:nowrap}.repo small{display:block;overflow-wrap:anywhere}.details{border-left:1px solid var(--line);padding-left:21px;display:flex;gap:10px;flex-direction:column;align-items:stretch}.details p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 7px}.check{display:flex;align-items:center;gap:7px}.check input{accent-color:var(--accent)}.details button{text-align:left}.notice{padding:11px 14px;border:1px solid var(--line);border-radius:6px;margin-top:20px;background:var(--panel);font-size:13px}.empty{padding:25px 0;color:var(--muted);line-height:1.7}.foot{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:7px 16px}.filter{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 12px;margin-bottom:13px}dialog{padding:0;border:1px solid #3a5b71;border-radius:10px;background:var(--panel);width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);color:var(--fg)}dialog::backdrop{background:#0009}dialog .title{padding:20px 22px 13px;border-bottom:1px solid var(--line)}dialog h3{font-size:18px;margin:0 0 7px}dialog .body{padding:20px 22px;overflow:auto;max-height:calc(100vh - 215px)}dialog label.field{display:block;margin-bottom:17px}dialog .field>span{display:block;color:var(--muted);margin-bottom:6px;font-size:12px}dialog input[type=text],dialog select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px}dialog .member{padding:7px 0}dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}.error{color:var(--danger);font-size:13px;line-height:1.5}.preview-note{border-left:3px solid var(--accent);padding-left:12px;line-height:1.6;font-size:13px;margin:14px 0}.theme{font-size:12px}.light{color-scheme:light;--bg:#f6f8fb;--panel:#fff;--card:#eaf0f6;--line:#cbd5e1;--fg:#172b40;--muted:#526b80;--accent:#007da3;--selected:#dcecf8;--danger:#ad2440}.light header{background:#edf2f7}
@media(max-width:900px){.app{grid-template-columns:190px 1fr}.content{grid-template-columns:1fr}.details{border-left:0;border-top:1px solid var(--line);padding:16px 0 0;display:grid;grid-template-columns:1fr 1fr}.details p,.details .check{grid-column:1/-1}.heading{padding:16px}.tools{padding:0 16px 16px}main{padding:18px}header{gap:17px}.app{height:calc(100vh - 150px)}}@media(max-width:560px){.app{grid-template-columns:145px 1fr}.heading h1{font-size:19px}.heading .muted{font-size:12px}.details{grid-template-columns:1fr}header{gap:12px;font-size:11px}.tools button{font-size:12px}.app{height:calc(100vh - 177px)}main{padding:13px}h2{font-size:20px}nav{padding:16px 5px}.repo{padding:11px}.repo .top{display:block}.tag{display:block;margin-top:5px}}
</style>
<header><span>File</span><span>Edit</span><span>View</span><span>Repository</span><span>Terminal</span><span>Window</span><span>Help</span></header>
<div class="heading"><div><h1>Repository manager</h1><div class="muted">Saved repositories and workspaces, organized your way</div></div><button class="theme" id="theme">Light</button></div>
<div class="tools"><button id="new">New workspace</button><button id="save-open">Save open as workspace</button><button id="reset">Reset preview</button></div>
<div class="app"><nav><div class="caption">Repositories</div><button class="flat" disabled>▱ &nbsp; All saved <span class="muted">3</span></button><button class="flat" disabled>▱ &nbsp; Ungrouped</button><div class="caption" style="margin-top:26px">Workspaces</div><div id="tree"></div></nav><main id="main"></main></div>
<div class="foot"><span>Interactive design preview · local sample data</span><span>Rocket</span></div>
<dialog id="form"><div class="title"><h3 id="form-title"></h3><small>Saved in Rocket. Repository files stay where they are.</small></div><div class="body" id="form-body"></div><footer><button id="cancel">Cancel</button><button id="submit" class="primary">Save workspace</button></footer></dialog>
<script>
const repos=[{id:1,name:'Rocket',path:'D:\\Projects\\Rocket'},{id:2,name:'Rocket CLI',path:'D:\\Projects\\Rocket-CLI'},{id:3,name:'文章 · Notes',path:'D:\\Projects\\文章 🚀'}];
const initial=[{id:1,name:'Work',parent:null,repos:[1]},{id:2,name:'Rocket',parent:1,repos:[1,2]},{id:3,name:'Documentation',parent:1,repos:[3]},{id:4,name:'Personal',parent:null,repos:[3]}];
let workspaces=structuredClone(initial),selected=1,closed=new Set(),include=false,filter='',notice='',mode,id,parent;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function descendants(id){let result=[];for(const w of workspaces.filter(w=>w.parent===id))result.push(w.id,...descendants(w.id));return result}
function crumb(id){const w=workspaces.find(w=>w.id===id);return w?(w.parent?crumb(w.parent)+' / ':'')+w.name:''}
function rows(parent=null,depth=0){let a=[];for(const w of workspaces.filter(w=>w.parent===parent)){a.push([w,depth]);if(!closed.has(w.id))a.push(...rows(w.id,depth+1))}return a}
function members(){const ids=[selected,...(include?descendants(selected):[])];return [...new Set(ids.flatMap(id=>workspaces.find(w=>w.id===id).repos))]}
function render(){
 $('tree').innerHTML=rows().map(([w,d])=>`<div class="tree-row ${w.id===selected?'active':''}" style="padding-left:${d*15}px"><button class="expand" data-toggle="${w.id}" aria-label="${closed.has(w.id)?'Expand':'Collapse'} ${esc(w.name)}" ${descendants(w.id).length?'':'disabled'}>${descendants(w.id).length?(closed.has(w.id)?'▸':'▾'):'·'}</button><button class="name" data-select="${w.id}" title="${esc(crumb(w.id))}"><span class="symbol">▱</span>${esc(w.name)}</button></div>`).join('');
 const w=workspaces.find(w=>w.id===selected);if(!w){$('main').innerHTML='<h2>Workspaces</h2><p class="empty">Create a workspace to organize repositories.</p>';return}
 const ids=members(),children=descendants(selected),found=ids.map(id=>repos.find(r=>r.id===id)).filter(r=>(r.name+' '+r.path).toLowerCase().includes(filter.toLowerCase()));
 $('main').innerHTML=`<div class="crumb">${esc(w.parent?crumb(w.parent):'Workspaces')}</div><h2>${esc(w.name)}</h2><div class="muted">${w.repos.length} repositories here · ${children.length} nested workspaces</div><div class="content"><section><input class="filter" id="filter" aria-label="Filter repositories" placeholder="Filter repository names or paths" value="${esc(filter)}"><div class="cards">${found.map(r=>`<div class="repo"><div class="top"><strong>${esc(r.name)}</strong><span class="tag">${w.repos.includes(r.id)?'This workspace':'Nested workspace'}</span></div><small>${esc(r.path)}</small></div>`).join('')||'<p class="empty">No repositories in this selection.<br>Choose a child workspace or include nested workspaces.</p>'}</div></section><aside class="details"><label class="check"><input id="include" type="checkbox" ${include?'checked':''} ${children.length?'':'disabled'}>Include nested workspaces</label><p>Opens ${ids.length} unique repositories. Existing tabs, terminal sessions and drafts stay open.</p><button id="open" class="primary" ${ids.length?'':'disabled'}>Open ${ids.length} repositories</button><button id="child">New child workspace</button><button id="edit">Edit workspace</button><button id="remove">Remove workspace</button></aside></div>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}`;
 $('filter').oninput=e=>{filter=e.target.value;const pos=e.target.selectionStart;render();$('filter').focus();$('filter').setSelectionRange(pos,pos)};$('include').onchange=e=>{include=e.target.checked;render()};$('open').onclick=()=>{notice=`Preview: ${ids.length} unique repositories would open. Existing tabs stay open.`;render()};$('child').onclick=()=>form('new',null,selected);$('edit').onclick=()=>form('edit',selected,w.parent);$('remove').onclick=()=>form('remove',selected,w.parent);
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);include=false;notice='';render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.toggle);closed.has(id)?closed.delete(id):closed.add(id);render()});
}
function form(kind,which=null,where=null){mode=kind;id=which;parent=where;const w=workspaces.find(w=>w.id===id),bad=new Set(id?[id,...descendants(id)]:[]);$('form-title').textContent=kind==='remove'?'Remove workspace':kind==='edit'?'Edit workspace':'New workspace';$('submit').textContent=kind==='remove'?'Remove workspace':'Save workspace';$('form-body').innerHTML=kind==='remove'?`<strong>${esc(crumb(id))}</strong><p class="preview-note">Only this saved workspace is removed. Its ${workspaces.filter(c=>c.parent===id).length} direct children move to ${esc(parent?crumb(parent):'the top level')}. Repository shortcuts, files and open tabs remain.</p><p class="error" id="error"></p>`:`<label class="field"><span>Name</span><input id="name" type="text" value="${esc(w?.name||'')}"></label><label class="field"><span>Parent workspace</span><select id="parent"><option value="">Top level</option>${workspaces.filter(x=>!bad.has(x.id)).map(x=>`<option value="${x.id}" ${x.id===parent?'selected':''}>${esc(crumb(x.id))}</option>`).join('')}</select></label><div class="caption" style="margin:0 0 8px">Repositories in this workspace</div>${repos.map(r=>`<label class="check member"><input type="checkbox" name="member" value="${r.id}" ${(w?.repos||(kind==='open'?[1,2]:[])).includes(r.id)?'checked':''}>${esc(r.name)}</label>`).join('')}<p class="muted">An empty workspace can organize child workspaces. Moving it keeps its children and memberships.</p><p class="error" id="error"></p>`;$('form').showModal();$('name')?.focus()}
$('submit').onclick=()=>{const old=structuredClone(workspaces),previousSelected=selected;if(mode==='remove'){const victim=workspaces.find(w=>w.id===id);workspaces=workspaces.filter(w=>w.id!==id);for(const w of workspaces)if(w.parent===id)w.parent=victim.parent}else{const name=$('name').value.trim(),p=$('parent').value?Number($('parent').value):null;if(!name){$('error').textContent='Enter a workspace name.';return}const value={id:id||Math.max(0,...workspaces.map(w=>w.id))+1,name,parent:p,repos:[...document.querySelectorAll('[name=member]:checked')].map(x=>Number(x.value))};workspaces=id?workspaces.map(w=>w.id===id?value:w):[...workspaces,value];selected=value.id}
 const names=new Set();for(const w of workspaces){const key=String(w.parent)+'/'+w.name.toLocaleLowerCase();if(names.has(key)){workspaces=old;selected=previousSelected;$('error').textContent='A workspace with this name already exists under that parent. Rename or move it first.';return}names.add(key)}if(!workspaces.some(w=>w.id===selected))selected=workspaces[0]?.id;notice='Saved in this preview. Repository files are unchanged.';include=false;$('form').close();render()};
$('cancel').onclick=()=>$('form').close();$('new').onclick=()=>form('new');$('save-open').onclick=()=>form('open');$('reset').onclick=()=>{workspaces=structuredClone(initial);selected=1;closed.clear();include=false;filter='';notice='';render()};$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light'};render();
</script></html>
