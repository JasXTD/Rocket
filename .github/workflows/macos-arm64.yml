name: macOS native preparation

# This is a development build, not a release or an automatic paid job.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac architecture (one runner per dispatch)
        type: choice
        default: arm64
        options: [arm64, x64]
      checks:
        description: Affected native checks to run
        type: choice
        default: followups
        options:
          - followups
          - platform
          - sandbox
          - desktop-integration
          - agent-security
          - agent-mcp

permissions:
  contents: read

concurrency:
  group: rocket-macos-preparation-${{ inputs.architecture }}-${{ inputs.checks }}
  cancel-in-progress: true

jobs:
  build:
    # This qualification is authorized only on free public-repository runners.
    if: ${{ (inputs.checks != 'agent-security' && inputs.checks != 'agent-mcp') || github.event.repository.private == false }}
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    # Native Intel cold compilation needs room for both tests and the MCP binary.
    timeout-minutes: ${{ inputs.checks == 'agent-mcp' && 40 || inputs.checks == 'agent-security' && 30 || 15 }}
    env:
      CARGO_TERM_COLOR: never
      ROCKET_MACOS_CHECK_SCOPE: ${{ inputs.checks }}
      ROCKET_REQUESTED_MAC_ARCH: ${{ inputs.architecture }}
      # Ephemeral runner only: a disposable Keychain, never a normal account item.
      ROCKET_MACOS_DISPOSABLE_KEYCHAIN_TEST: '1'
    steps:
      - name: Validate requested checks
        shell: bash
        run: |
          set -euo pipefail
          case "$ROCKET_REQUESTED_MAC_ARCH" in arm64|x64) ;; *) echo 'Unsupported architecture selection' >&2; exit 2 ;; esac
          case "$ROCKET_MACOS_CHECK_SCOPE" in
            followups|platform|sandbox|desktop-integration|agent-security|agent-mcp) ;;
            *) printf '%s\n' 'Unsupported check selection' >&2; exit 2 ;;
          esac
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Select the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/rocket-macos-bootstrap.log") 2>&1
          source tools/macos/architecture.sh
          rocket_macos_architecture
          test "$ROCKET_MAC_ARCH" = "$ROCKET_REQUESTED_MAC_ARCH"
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup run 1.99.1 rustc -vV

      - name: Build and run the affected native checks
        # Leave time to retain diagnostics if compilation or acceptance times out.
        timeout-minutes: ${{ inputs.checks == 'agent-mcp' && 35 || inputs.checks == 'agent-security' && 25 || 15 }}
        shell: bash
        env:
          ROCKET_MACOS_OUTPUT: ${{ runner.temp }}/rocket-macos-stage1
        run: |
          set -euo pipefail
          if [ "$ROCKET_MACOS_CHECK_SCOPE" = agent-security ] || [ "$ROCKET_MACOS_CHECK_SCOPE" = agent-mcp ]; then
            bash tools/macos/test-agent-executable-security.sh 2>&1 | tee "$RUNNER_TEMP/rocket-macos-invocation.log"
          elif [ "$ROCKET_MACOS_CHECK_SCOPE" = sandbox ]; then
            # GitHub-hosted disposable OS user only. Never a normal account's container.
            export ROCKET_MACOS_SANDBOX_DISPOSABLE_USER=1
            bash tools/test-macos-sandbox.sh 2>&1 | tee "$RUNNER_TEMP/rocket-macos-invocation.log"
          elif [ "$ROCKET_MACOS_CHECK_SCOPE" = desktop-integration ]; then
            bash tools/macos/test-desktop-integration.sh 2>&1 | tee "$RUNNER_TEMP/rocket-macos-invocation.log"
          else
            node --test tools/tests/test-macos-preflight.cjs 2>&1 | tee "$RUNNER_TEMP/rocket-macos-preflight.log"
            bash tools/build-macos.sh 2>&1 | tee "$RUNNER_TEMP/rocket-macos-invocation.log"
          fi

      - name: Retain development app and check results
        if: ${{ always() && (inputs.checks == 'agent-security' || inputs.checks == 'agent-mcp' || !cancelled()) }}
        timeout-minutes: ${{ (inputs.checks == 'agent-security' || inputs.checks == 'agent-mcp') && 2 || 15 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocket-macos-${{ inputs.architecture }}-stage1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rocket-macos-bootstrap.log
            ${{ runner.temp }}/rocket-macos-invocation.log
            ${{ runner.temp }}/rocket-macos-preflight.log
            ${{ runner.temp }}/rocket-macos-stage1/*.log
            ${{ runner.temp }}/rocket-macos-stage1/*.json
            ${{ runner.temp }}/rocket-macos-stage1/*.md
            ${{ runner.temp }}/rocket-macos-stage1/*.zip
            ${{ runner.temp }}/rocket-macos-stage1/*.sha256
            ${{ runner.temp }}/rocket-macos-stage1/sandbox/result.json
            ${{ runner.temp }}/rocket-macos-stage1/mcp/*/result.json
            ${{ runner.temp }}/rocket-macos-stage1/mcp/*/*.png
            ${{ runner.temp }}/rocket-macos-stage1/Rocket.iconset/icon_512x512@2x.png
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
